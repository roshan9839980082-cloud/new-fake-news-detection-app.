<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Create Account</title><script src="../js/theme-init.js"></script><link rel="stylesheet" href="../css/mobile-app.css"><link rel="icon" type="image/png" href="../images/fakenewsdetect-logo.png"></head><body data-page="signup"><main class="auth-shell auth-shell-modern"><a class="auth-back" href="login.html">‹</a><div class="auth-brand"><div class="auth-project-logo"><img src="../images/fakenewsdetect-logo.png" alt="FakeNewsDetect logo"></div><h1>Create Account</h1><p>Join FakeNews<span>Detect</span></p></div><div class="auth-card"><form class="auth-form" id="authForm"><div class="form-group"><label>Full Name</label><input class="form-control" id="fullName" required minlength="2" autocomplete="name" placeholder="Your name"></div><div class="form-group"><label>Email address</label><input class="form-control" id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="form-group"><label>Password</label><input class="form-control" id="password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></div><label class="check-row"><input id="showPassword" type="checkbox"> Show password</label><button class="primary-btn" id="authBtn" type="submit">Create Account</button></form><div class="auth-link">Already have an account? <a href="login.html">Sign in</a></div></div><div class="auth-foot">Account is stored in MongoDB. Firebase is mirrored only for forgot-password reset emails.</div></main><div id="toast" class="toast"></div><script src="../js/app.js"></script></body></html>
