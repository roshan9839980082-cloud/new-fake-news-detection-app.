<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reset Password</title><script src="../js/theme-init.js"></script><link rel="stylesheet" href="../css/mobile-app.css"><link rel="icon" type="image/png" href="../images/fakenewsdetect-logo.png"></head><body data-page="reset-password"><main class="auth-shell auth-shell-modern"><a class="auth-back" href="login.html">‹</a><div class="auth-brand"><div class="auth-project-logo"><img src="../images/fakenewsdetect-logo.png" alt="FakeNewsDetect logo"></div><h1>Reset Password</h1><p id="resetStatus">Checking your Firebase reset link…</p></div><div class="auth-card"><form class="auth-form" id="resetPasswordForm"><div class="form-group"><label>New password</label><input class="form-control" id="newPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></div><div class="form-group"><label>Confirm password</label><input class="form-control" id="confirmPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="Repeat new password"></div><label class="check-row"><input id="showResetPassword" type="checkbox"> Show passwords</label><button class="primary-btn" id="resetPasswordBtn" type="submit">Reset Password</button></form><div id="resetDone" class="success-panel" hidden><strong>Password updated</strong><p>Firebase reset and MongoDB password are now synchronized.</p><a class="primary-btn" href="login.html">Sign In</a></div></div></main><div id="toast" class="toast"></div><script src="../js/app.js"></script></body></html>
