<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Forgot Password</title><script src="../js/theme-init.js"></script><link rel="stylesheet" href="../css/mobile-app.css"><link rel="icon" type="image/png" href="../images/fakenewsdetect-logo.png"></head><body data-page="forgot"><main class="auth-shell auth-shell-modern"><a class="auth-back" href="login.html">‹</a><div class="auth-brand"><div class="auth-project-logo"><img src="../images/fakenewsdetect-logo.png" alt="FakeNewsDetect logo"></div><h1>Forgot Password?</h1><p>Firebase sends the reset email; your new password is synced back to MongoDB.</p></div><div class="auth-card"><form class="auth-form" id="forgotForm"><div class="form-group"><label>Email address</label><input class="form-control" id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><button class="primary-btn" id="forgotBtn" type="submit">Send Reset Link</button></form><div id="forgotSuccess" class="success-panel" hidden><strong>Email sent</strong><p>Check your inbox and spam folder, then open the reset link.</p></div><div class="auth-link"><a href="login.html">Back to Sign In</a></div></div></main><div id="toast" class="toast"></div><script src="../js/app.js"></script></body></html>
